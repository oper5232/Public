services:
  pipeline:
    image: python:3.12-slim
    working_dir: /app
    command: [python, pipeline.py]
    environment:
      PIPELINE_API_KEY: ${PIPELINE_API_KEY:?Set a new pipeline key}
      PIPELINE_HOST: 0.0.0.0
      PIPELINE_DB: /state/pipeline.sqlite
      PIPELINE_INBOX: /inbox
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_CANDIDATES_DATA_SOURCE_ID: ${NOTION_CANDIDATES_DATA_SOURCE_ID:-}
    volumes:
      - ./pipeline.py:/app/pipeline.py:ro
      - pipeline_state:/state
      - ./inbox:/inbox
    ports:
      - 127.0.0.1:8787:8787
    restart: unless-stopped
  n8n:
    # Choose and record a supported version; do not deploy an implicit latest tag.
    image: ${N8N_IMAGE:?Set a tested n8n image tag}
    environment:
      GENERIC_TIMEZONE: Asia/Seoul
      TZ: Asia/Seoul
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set a new encryption key}
    ports:
      - 127.0.0.1:5678:5678
    volumes:
      - n8n_state:/home/node/.n8n
    depends_on:
      - pipeline
    restart: unless-stopped
volumes:
  pipeline_state:
  n8n_state:
