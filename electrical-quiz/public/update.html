<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>문제은행 업데이트</title>
<style>
:root{color-scheme:light dark}body{font:16px/1.65 system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:24px}h1{font-size:26px}button,a{font:inherit}button{padding:12px 20px;border-radius:10px;cursor:pointer;min-height:48px}#status{overflow-wrap:anywhere}
</style>
<h1>문제은행 업데이트</h1>
<p id="status" role="status" aria-live="polite">최신 버전을 확인하고 있습니다…</p>
<p>학습 기록과 로그인 정보는 유지됩니다. 준비가 끝나면 문제은행으로 이동합니다.</p>
<button id="retry" type="button" disabled>다시 시도</button>
<p><a href="./">문제은행으로 돌아가기</a></p>
<script>
const status=document.getElementById('status'),retry=document.getElementById('retry');
function untilState(worker,states){return new Promise((resolve,reject)=>{
 const timer=setTimeout(()=>done(Error('연결을 확인하고 다시 시도해 주세요.')),30000);
 function done(error){clearTimeout(timer);worker.removeEventListener('statechange',changed);error?reject(error):resolve();}
 function changed(){if(states.includes(worker.state))done();else if(worker.state==='redundant')done(Error('설치가 중단됐습니다. 다시 시도해 주세요.'));}
 worker.addEventListener('statechange',changed);changed();
});}
async function update(){
 retry.disabled=true;status.textContent='최신 버전을 확인하고 있습니다…';
 try{
  if(!navigator.onLine)throw Error('인터넷 연결 후 다시 시도해 주세요.');
  if(!('serviceWorker' in navigator)){location.replace('./');return;}
  const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
  await reg.update();
  let worker=reg.installing||reg.waiting;
  if(worker&&worker.state!=='installed'&&worker.state!=='activated')await untilState(worker,['installed','activated']);
  worker=reg.waiting||(worker?.state==='installed'?worker:null);
  if(worker){status.textContent='새 버전을 적용하고 있습니다…';const activated=untilState(worker,['activated']);worker.postMessage('ACTIVATE_UPDATE');await activated;}
  status.textContent='업데이트 완료. 문제은행을 엽니다…';location.replace('./');
 }catch(error){status.textContent='업데이트를 완료하지 못했습니다: '+error.message;retry.disabled=false;}
}
retry.onclick=update;update();
</script>
</html>
